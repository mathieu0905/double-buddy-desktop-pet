name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites-web/package-lock.json
      - name: Install desktop pet dependencies
        run: npm ci
      - name: Test desktop pet state model
        run: npm test
      - name: Install Sites dependencies
        working-directory: sites-web
        run: npm ci
      - name: Build and test Sites version
        working-directory: sites-web
        run: npm test
